[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurogen"
version = "0.1.0"
description = "Testing superposition vs. recursive generalization in single SwiGLU neurons of Qwen3"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "transformers>=4.51",   # first release with Qwen3
  "numpy",
  "pyyaml",
  "matplotlib",
  "pandas",               # reading corpus parquet/jsonl, summary tables
  "pyarrow",
]

[project.optional-dependencies]
notebook = ["jupyter"]
dev = ["pytest"]

[tool.setuptools]
packages = ["neurogen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
